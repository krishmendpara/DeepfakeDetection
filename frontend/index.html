<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PixelTruth AI</title>

    <style>
      /* Clipping wrapper: fixed viewport-size, overflow hidden.
         The WebGPU renderer reads the parent's offsetHeight → viewport, not document. */
      #tubes-wrap {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        z-index: 0;
        pointer-events: none;
        /* Smooth fade when scrolling past hero */
        transition: opacity 0.4s ease;
      }

      #tubes-canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <!-- Tubes canvas — hidden automatically when user scrolls past hero -->
    <div id="tubes-wrap">
      <canvas id="tubes-canvas"></canvas>
    </div>

    <!-- React app -->
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <script type="module">
      import TubesCursor from 'https://cdn.jsdelivr.net/npm/threejs-components@0.0.19/build/cursors/tubes1.min.js';

      const canvas = document.getElementById('tubes-canvas');
      const wrap   = document.getElementById('tubes-wrap');

      // Explicit pixel dims — belt-and-suspenders against WebGPU overflow
      const setSize = () => {
        canvas.width  = window.innerWidth;
        canvas.height = window.innerHeight;
      };
      setSize();
      window.addEventListener('resize', setSize);

      // Site palette: gold / teal / bronze
      TubesCursor(canvas, {
        tubes: {
          colors: ['#c9a84c', '#1a8f7a', '#906814'],
          lights: {
            intensity: 200,
            colors: ['#e2c47a', '#2abfa5', '#c9a84c', '#0d5c4a'],
          },
        },
      });

      // ── Fade the tubes out when the user scrolls past the hero (100vh) ──
      const heroHeight = () => window.innerHeight; // hero = 100vh
      const handleScroll = () => {
        const scrolled = window.scrollY;
        const h = heroHeight();
        if (scrolled >= h) {
          wrap.style.opacity = '0';
          wrap.style.pointerEvents = 'none';
        } else {
          // Fade starts at 60% of hero scrolled
          const progress = Math.min(scrolled / (h * 0.8), 1);
          wrap.style.opacity = String(1 - progress);
        }
      };
      window.addEventListener('scroll', handleScroll, { passive: true });
    </script>
  </body>
</html>
